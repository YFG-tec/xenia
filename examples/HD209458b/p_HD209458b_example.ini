; Example input deck for PLUTO_XMF
; Target system: HD 209458b
; Based on the configuration used in Xing, Yan & Guo (2023), ApJ 953:166.
;
; Run from the solver directory (SSH_220804):
;   ./pluto -i ../examples/HD209458b/p_HD209458b_example.ini
;

[Grid]
X1-grid    2    1.0    1      u    1.0001    1023      s    10
X2-grid    1    0.0    1      u    1.0
X3-grid    1    0.0    1      u    1.0

[Time]
CFL              0.9
CFL_max_var      1.1
tstop            6000
first_dt         1.e-6

[Solver]
Solver         hll

[Boundary]
X1-beg        userdef
X1-end        userdef
X2-beg        reflective
X2-end        reflective
X3-beg        outflow
X3-end        outflow

[Static Grid Output]
; Write outputs into the example folder (relative to where you run ./pluto)
output_dir ../examples/HD209458b/output/run1
uservar    2 r theta
dbl        10.0  -1   single_file
flt        -0.1  -1   single_file
vtk        0.1  -1   single_file
log        1000
analysis  -1.0  -1

[Parameters]
R_Planet                1.36
M_Planet                0.69
R_Orbit                 0.04707
M_Star                  1.119
Y_Star                  4.0
LB_PRS                  1.2
LB_B                    0.284
GAMMA                   1.66666667

HE_SH_COEF              1.0
XUV_FACTOR              0.25
STOP_POINT              1.00
BASE_ION_RATE           1.0e-3
NUMBER_DENSITY_BEG      1.0e13
TREND_NEU               -2.0
TREND_ION               -2.0
TEMPTURE_BEG            1500

HE_RATIO                0.0776441
XUV_TOT_FLUX            4.716
SPECTRAL_INDEX_504A     0.89
HEATING_EFFICIENCY      0.20

IC_FROM_FILE            1
OUTO_NAME               1
XUV_RESIZE              1
TREND_HE                -4.0
TREND_H                 -2.0

OUTPUT_INTERVAL         10

FXUV_INI                5.0
FXUV_TIME               1000
CONTINUE                0

[Model_Settings]
; Use the self-contained inputs shipped with this example
SED_FILE ../examples/HD209458b/inputs/SED_lists/hd209458b-1163.dat
IC_FILE  ../examples/HD209458b/inputs/IC_files/HD209458b_IC0.dat
OBJ_NAME HD209458b
