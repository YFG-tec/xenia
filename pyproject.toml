[build-system]
# scikit-build-core finds/injects cmake and ninja itself on top of this.
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "xmf"
version = "0.1.0"
description = "Xenia: table-driven multi-fluid hydrodynamics (import xmf)."
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.scikit-build]
# Pin the Ninja generator: the PyPI cmake wheel defaults to NMake Makefiles
# on Windows (no MSVC here), while Ninja is on PATH or injected by
# scikit-build-core. Works the same on Linux.
cmake.args = ["-G", "Ninja"]
wheel.packages = ["src/xmf"]
# The C sources are compiled at install time; they are not runtime data and
# must not ship inside the wheel (they stay in the source tree / sdist).
wheel.exclude = ["xmf/core/*.c", "xmf/core/*.h"]
# Cache the CMake build tree outside the source tree (src/xmf/ stays clean);
# reinstalling reuses the configured build directory.
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
